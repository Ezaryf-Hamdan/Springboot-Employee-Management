<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee System - Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>Employee Management System</h2>
    <div class="form-container">
        <form id="authForm">
            <label for="username"></label><input type="text" id="username" placeholder="Username" required />
            <label for="password"></label><input type="password" id="password" placeholder="Password" required />
            <div class="buttons">
                <button type="submit" onclick="submitForm('register')">Register</button>
                <button type="submit" onclick="submitForm('login')">Login</button>
            </div>
        </form>
        <div id="result"></div>
    </div>
</div>

<script>
    async function submitForm(action) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const response = await fetch(`/api/auth/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const result = await response.json();
        document.getElementById('result').innerText =
            action === 'login' && response.ok ? `Token: ${result.token}` :
            result.message || JSON.stringify(result);
    }
</script>
</body>
</html>
